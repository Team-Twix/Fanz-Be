spring:
  application:
    name: Fanz-Be

  datasource:
    url: jdbc:mysql://localhost:3306/fanz?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 전략 B: 개발 초기엔 엔티티 기준으로 스키마 자동 생성/갱신.
      # 스키마가 확정되면 validate 로 바꾸고 Flyway 로 관리 전환.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # 전략 B: 아직 Flyway 마이그레이션을 쓰지 않으므로 비활성화.
  # 스키마 확정 후 V1__init.sql baseline 을 만들고 enabled: true 로 전환.
  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

# 개발 중 실행되는 SQL 확인용 (원치 않으면 삭제)
logging:
  level:
    org.hibernate.SQL: debug

jwt:
  secret: ${JWT_SECRET:fanz-be-dev-secret-key-with-at-least-256-bits-for-hs256-local-only}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

app:
  upload:
    directory: ${UPLOAD_DIRECTORY:uploads}
    max-image-bytes: 10485760
    max-file-bytes: 20971520
