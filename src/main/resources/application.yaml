spring:
  application:
    name: Fanz-Be

  datasource:
    url: jdbc:mysql://localhost:3306/fanz?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

# 개발 중 실행되는 SQL 확인용 (원치 않으면 삭제)
logging:
  level:
    org.hibernate.SQL: debug

jwt:
  secret: ${JWT_SECRET:fanz-be-dev-secret-key-with-at-least-256-bits-for-hs256-local-only}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  upload:
    directory: ${UPLOAD_DIRECTORY:uploads}
    max-image-bytes: 10485760
    max-file-bytes: 20971520
