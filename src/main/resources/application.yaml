spring:
  application:
    name: Fanz-Be

  datasource:
    url: jdbc:mysql://localhost:3306/fanz?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: false

logging:
  level:
    org.hibernate.SQL: debug

jwt:
  secret: ${JWT_SECRET:fanz-be-dev-secret-key-with-at-least-256-bits-for-hs256-local-only}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}
